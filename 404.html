<!DOCTYPE html>

<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>404 — PAGE NOT FOUND | STACKLY CREATIVE STUDIO</title>
<meta content="The requested page could not be located in Stackly Studio matrix. Return to safety." name="description"/>
<!-- Google Fonts: Space Grotesk (Display) & Inter (Body) -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;family=Space+Grotesk:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<!-- FontAwesome Icons -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<!-- Main CSS -->
<link href="styles.css" rel="stylesheet"/>
<!-- GSAP Engine -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" rel="stylesheet"/>
</head>
<body class="error-page-body">
<!-- PRELOADER -->

<!-- Custom Kinetic Interactive Cursor -->
<div class="custom-cursor" id="custom-cursor"></div>
<div class="cursor-follower" id="cursor-follower">
<span class="cursor-label">404</span>
</div>
<!-- MAIN 404 FULLSCREEN CONTAINER -->
<div class="error-page-wrapper">
<!-- Background Glowing Ambient Orbs & Grid -->
<div class="error-bg-glow" id="error-bg-glow"></div>
<div class="error-grid-bg"></div>
<!-- Floating Geometry Shapes -->
<div class="error-floating-shapes">
<div class="error-shape error-shape-1" id="shape-1"></div>
<div class="error-shape error-shape-2" id="shape-2"></div>
<div class="error-shape error-shape-3" id="shape-3"></div>
</div>
<!-- Central Error Content Card -->
<div class="error-content-card" id="error-content-card">
<a class="error-logo-link" href="index.html" title="Return to STACKLY Home">
<img alt="STACKLY Logo" class="brand-logo-img" src="assets/logo.webp"/>
</a>
<div class="error-badge">
<i class="fa-solid fa-triangle-exclamation"></i>
<span>DIMENSION MISALIGNMENT // ERROR 404</span>
</div>
<h1 class="error-number-glitch" id="error-404-num">404</h1>
<h2 class="error-title">COORDINATES UNRESOLVED</h2>
<p class="error-desc">
        The visual matrix trajectory you are attempting to access does not exist or has been relocated to another dimension.
      </p>
<!-- Action Buttons -->
<div class="error-actions-group">
<a class="btn-error-primary magnetic-btn" data-cursor="hover" href="index.html">
<i class="fa-solid fa-house"></i>
<span>RETURN TO HOME</span>
</a>
<button class="btn-error-secondary magnetic-btn" data-cursor="hover" type="button" id="go-back-404-btn">
<i class="fa-solid fa-arrow-left"></i>
<span>GO BACK</span>
</button>
</div>
</div>
</div>
<!-- Main JavaScript File -->
<script src="main.js"></script>
<!-- Continuous GSAP Animation Script for 404 Page -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof gsap !== 'undefined') {
        // Continuous float animation for 404 header number
        gsap.to('#error-404-num', {
          y: -18,
          rotation: 1.5,
          scale: 1.02,
          duration: 2.8,
          repeat: -1,
          yoyo: true,
          ease: 'sine.inOut'
        });

        // Continuous pulse for background glowing orb
        gsap.to('#error-bg-glow', {
          scale: 1.3,
          opacity: 0.85,
          duration: 3.8,
          repeat: -1,
          yoyo: true,
          ease: 'sine.inOut'
        });

        // Continuous floating geometry shapes loops
        gsap.to('#shape-1', {
          y: -30,
          x: 20,
          rotation: 120,
          duration: 4.2,
          repeat: -1,
          yoyo: true,
          ease: 'sine.inOut'
        });

        gsap.to('#shape-2', {
          y: 25,
          x: -20,
          rotation: -90,
          duration: 5.0,
          repeat: -1,
          yoyo: true,
          ease: 'sine.inOut'
        });

        gsap.to('#shape-3', {
          y: -20,
          x: -15,
          rotation: 45,
          scale: 1.15,
          duration: 3.5,
          repeat: -1,
          yoyo: true,
          ease: 'sine.inOut'
        });

        // Entrance animation on load
        gsap.from('#error-content-card > *', {
          opacity: 0,
          y: 35,
          duration: 1,
          stagger: 0.15,
          ease: 'power3.out',
          delay: 0.2
        });
      }

      // Return to exact previous page section logic
      const urlBefore404 = sessionStorage.getItem('urlBefore404');
      const goBackBtn = document.getElementById('go-back-404-btn') || document.querySelector('.btn-error-secondary');
      const returnHomeBtn = document.querySelector('.btn-error-primary');
      const logoLink = document.querySelector('.error-logo-link');

      function handleGoBack(e) {
        if (e) e.preventDefault();
        if (window.history.length > 1) {
          window.history.back();
        } else if (urlBefore404) {
          window.location.href = urlBefore404;
        } else {
          window.location.href = 'index.html';
        }
      }

      if (goBackBtn) {
        goBackBtn.onclick = handleGoBack;
      }
      if (returnHomeBtn) {
        returnHomeBtn.addEventListener('click', (e) => {
          if (urlBefore404 && (urlBefore404.includes('index.html') || urlBefore404.endsWith('/'))) {
            handleGoBack(e);
          }
        });
      }
      if (logoLink) {
        logoLink.addEventListener('click', (e) => {
          if (urlBefore404 && (urlBefore404.includes('index.html') || urlBefore404.endsWith('/'))) {
            handleGoBack(e);
          }
        });
      }
    });
  </script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
</body>
</html>
